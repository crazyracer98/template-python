# Infra-stack service: Playwright, for running browser-based end-to-end
# tests against the api service from inside the docker network. Installs
# the project's "e2e" optional-dependency group from pyproject.toml (the
# single source for those versions — see req in CLAUDE.md) on start, then
# idles. The bind-mount path below is relative to .devcontainer/, not this
# file's own directory — see CLAUDE.md's "Devcontainer stack pattern"
# section.
services:
  playwright:
    image: mcr.microsoft.com/playwright/python:v1.62.0-noble
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    environment:
      E2E_BASE_URL: http://api:8000
    command: >-
      sh -c "pip install --no-cache-dir --disable-pip-version-check -e '.[e2e]' && sleep infinity"
