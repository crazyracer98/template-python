# Stack service: Redis, reachable only from other containers on the
# compose-generated default network (see ../README.md).
services:
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
