# Project metadata, dependencies, and every linter/type-checker/test-runner
# config: see CLAUDE.md's "Configuration" section for why it all lives here.
[project]
name = "template-python"
version = "0.1.0"
description = "Template repository for FastAPI projects"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.13.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "prek==0.5.2",
    "httpx2==2.12.0",
    "playwright==1.62.0",
    "pytest-playwright==0.9.0",
    "selenium==4.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Curated strict set: correctness + style + security (S) + pylint (PL) +
# mandatory type annotations (ANN) + docstrings on public members (D1xx --
# only the "missing docstring" checks, not D2xx/D4xx formatting conventions).
# Every selected rule is a hard failure -- there is no "warn only" tier.
# COM812/ISC001 are excluded because they conflict with the ruff formatter
# (ruff's own documented recommendation).
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "N", "S", "A", "SIM", "RUF", "PL", "ANN",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test, and comparing to literal expected values
# is not a "magic number". Covers tests/ and tests/e2e/ alike.
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra --ignore=tests/e2e"
filterwarnings = [
    "error",
    # starlette 1.6.0's testclient module still references the anyio.abc.BlockingPortal
    # alias that anyio 4.15.0 deprecated in favor of anyio.from_thread.BlockingPortal --
    # a starlette bug, not ours to fix here.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\\.testclient",
]
